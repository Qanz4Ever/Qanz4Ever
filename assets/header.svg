<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#091122" />
      <stop offset="100%" stop-color="#070B16" />
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="glowCyan" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="85%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38ef7d" stop-opacity="0.5" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#00f2fe" fill-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />
  <rect width="1200" height="360" rx="16" fill="url(#glowCyan)" />
  <rect width="1200" height="360" rx="16" fill="url(#glowViolet)" />

  <!-- Frame Border -->
  <rect x="1.5" y="1.5" width="1197" height="357" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Decorative Circuit Paths -->
  <g stroke="#00f2fe" stroke-opacity="0.2" stroke-width="1.5" fill="none">
    <path d="M 40 60 L 160 60 L 200 100 L 320 100" />
    <path d="M 880 260 L 1000 260 L 1040 220 L 1160 220" />
    <circle cx="320" cy="100" r="3" fill="#00f2fe" fill-opacity="0.6" />
    <circle cx="880" cy="260" r="3" fill="#8b5cf6" fill-opacity="0.6" />
  </g>

  <!-- Left Side: Futuristic Terminal Emblem -->
  <g transform="translate(85, 75)">
    <!-- Outer Glow Circle -->
    <circle cx="105" cy="105" r="95" fill="#00f2fe" fill-opacity="0.04" />
    <circle cx="105" cy="105" r="85" fill="none" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle cx="105" cy="105" r="70" fill="#0B132B" stroke="#00f2fe" stroke-width="2" filter="url(#neonGlow)" />

    <!-- Terminal Window Graphic inside Circle -->
    <rect x="65" y="70" width="80" height="70" rx="8" fill="#070b16" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Header dots -->
    <circle cx="75" cy="79" r="2.5" fill="#ef4444" />
    <circle cx="83" cy="79" r="2.5" fill="#f59e0b" />
    <circle cx="91" cy="79" r="2.5" fill="#10b981" />
    <line x1="65" y1="87" x2="145" y2="87" stroke="#1e293b" stroke-width="1" />
    
    <!-- Code prompt >_ -->
    <text x="73" y="107" fill="#00f2fe" font-family="'Courier New', monospace" font-size="14" font-weight="bold">&gt;_</text>
    <rect x="95" y="98" width="18" height="11" fill="#38bdf8" fill-opacity="0.7">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
    <text x="73" y="127" fill="#a78bfa" font-family="'Courier New', monospace" font-size="11">dev:~$</text>
  </g>

  <!-- Main Content Center / Right -->
  <g transform="translate(320, 80)">
    <!-- Status Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="260" height="26" rx="13" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#34d399">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">VERSATILE SOFTWARE ENGINEER</text>
    </g>

    <!-- Name / Brand -->
    <text x="0" y="70" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">
      MFSAVANA
    </text>

    <!-- Subtitle -->
    <text x="0" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
      Desktop Apps (C# / .NET) • Full-Stack Web • Systems &amp; Automation
    </text>

    <!-- Tech Badges Bar -->
    <g transform="translate(0, 138)">
      <!-- Badge 1: C# / .NET -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="105" height="30" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔷 C# / .NET</text>
      </g>

      <!-- Badge 2: Node.js -->
      <g transform="translate(115, 0)">
        <rect x="0" y="0" width="98" height="30" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#22C55E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Node.js</text>
      </g>

      <!-- Badge 3: Python -->
      <g transform="translate(223, 0)">
        <rect x="0" y="0" width="92" height="30" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🐍 Python</text>
      </g>

      <!-- Badge 4: Bash/Linux -->
      <g transform="translate(325, 0)">
        <rect x="0" y="0" width="125" height="30" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🐧 Bash / Linux</text>
      </g>

      <!-- Badge 5: Security & Tools -->
      <g transform="translate(460, 0)">
        <rect x="0" y="0" width="140" height="30" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Security &amp; Ops</text>
      </g>

      <!-- Badge 6: Indonesia -->
      <g transform="translate(610, 0)">
        <rect x="0" y="0" width="135" height="30" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📍 Indonesia 🇮🇩</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#titleGrad)" />
</svg>
